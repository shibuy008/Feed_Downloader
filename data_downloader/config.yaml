# Feed Downloader Configuration
# This file defines all vendor sources and their connection details

# Global settings
global:
  # Default download directory
  download_dir: "./downloads"
  
  # Default timeout for connections (seconds)
  timeout: 30
  
  # Retry settings
  max_retries: 3
  retry_delay: 5
  
  # Logging settings
  log_level: "INFO"
  log_file: "./logs/feed_downloader.log"

# Vendor configurations
vendors:
  # Example 1: SFTP vendor for CSV data (scheduled)
  - name: "vendor_sftp"
    type: "sftp"
    host: "sftp.example.com"
    port: 22
    username: "your_username"
    password: "your_password"
    remote_path: "/data/daily_prices.csv"
    local_path: "./downloads/vendor_sftp.csv"
    format: "csv"
    compressed: false
    schedule:
      type: "scheduled"
      cron: "0 8 * * *"  # Daily at 8 AM
      timezone: "UTC"
      enabled: true
      max_retries: 3
      retry_delay: 300
    
  # Example 2: REST API vendor for JSON data (real-time)
  - name: "vendor_api"
    type: "rest_api"
    endpoint: "https://api.coindesk.com/v1/bpi/currentprice.json"
    headers:
      User-Agent: "Feed-Downloader/1.0"
    params: {}
    local_path: "./downloads/vendor_api.json"
    format: "json"
    timeout: 30
    schedule:
      type: "real_time"
      interval_seconds: 300  # Every 5 minutes
      timezone: "UTC"
      enabled: true
      max_retries: 3
      retry_delay: 60
    
  # Example 3: WebSocket vendor for real-time data (continuous)
  - name: "vendor_ws"
    type: "websocket"
    url: "wss://ws.postman-echo.com/raw"
    subscription_message: "Hello WebSocket"
    local_path: "./downloads/vendor_ws.json"
    format: "json"
    duration: 10  # seconds to collect data
    max_messages: 100
    schedule:
      type: "real_time"
      interval_seconds: 60  # Every minute
      timezone: "UTC"
      enabled: true
      max_retries: 5
      retry_delay: 30
    
  # Example 4: HTTP file download
  - name: "vendor_http"
    type: "http"
    url: "https://example.com/data.csv"
    headers:
      User-Agent: "Feed-Downloader/1.0"
    local_path: "./downloads/vendor_http.csv"
    format: "csv"
    chunk_size: 8192
    
  # Example 5: Compressed ZIP file from SFTP
  - name: "vendor_zip"
    type: "sftp"
    host: "sftp.example.com"
    port: 22
    username: "your_username"
    password: "your_password"
    remote_path: "/data/archive.zip"
    local_path: "./downloads/vendor_archive.zip"
    format: "csv"
    compressed: true
    compression_type: "zip"
    
  # Example 6: Excel file from REST API
  - name: "vendor_excel"
    type: "rest_api"
    endpoint: "https://example.com/report.xlsx"
    headers:
      Authorization: "Bearer your_token"
    local_path: "./downloads/vendor_report.xlsx"
    format: "excel"
    
  # Example 7: XML feed (RSS/Atom)
  - name: "vendor_xml"
    type: "http"
    url: "https://feeds.finance.yahoo.com/rss/2.0/headline"
    local_path: "./downloads/vendor_news.xml"
    format: "xml"
    
  # Example 8: Financial data with authentication (market hours only)
  - name: "vendor_auth"
    type: "rest_api"
    endpoint: "https://api.financial-data.com/prices"
    headers:
      Authorization: "Bearer your_api_token"
      Content-Type: "application/json"
    params:
      symbol: "AAPL"
      interval: "1h"
      limit: 1000
    local_path: "./downloads/vendor_auth.json"
    format: "json"
    schedule:
      type: "scheduled"
      cron: "0 9-16 * * 1-5"  # Every hour during market hours (9 AM - 4 PM, weekdays)
      timezone: "America/New_York"
      enabled: true
      max_retries: 3
      retry_delay: 300
    
  # Example 9: Real-time market data via WebSocket
  - name: "vendor_market"
    type: "websocket"
    url: "wss://stream.binance.com:9443/ws/btcusdt@ticker"
    subscription_message: null  # No subscription needed for this endpoint
    local_path: "./downloads/vendor_market.json"
    format: "json"
    duration: 30
    max_messages: 1000

# Parsing configurations (optional)
parsing:
  # CSV parsing options
  csv:
    delimiter: ","
    encoding: "utf-8"
    parse_dates: true
    infer_datetime_format: true
    
  # JSON parsing options
  json:
    encoding: "utf-8"
    normalize_nested: true
    
  # XML parsing options
  xml:
    encoding: "utf-8"
    namespaces: {}
    
  # Excel parsing options
  excel:
    engine: "openpyxl"
    na_values: ["", "N/A", "n/a", "NULL", "null", "NaN", "nan"]

# Scheduling configurations
scheduling:
  # Common cron expressions for financial data
  common_schedules:
    market_open: "0 9 * * 1-5"        # 9 AM weekdays
    market_close: "0 16 * * 1-5"      # 4 PM weekdays
    daily_morning: "0 8 * * *"        # 8 AM daily
    daily_evening: "0 18 * * *"       # 6 PM daily
    hourly: "0 * * * *"               # Every hour
    every_15_minutes: "*/15 * * * *"  # Every 15 minutes
    every_5_minutes: "*/5 * * * *"    # Every 5 minutes
    weekly_monday: "0 9 * * 1"        # 9 AM Mondays
    monthly_first: "0 9 1 * *"        # 9 AM first day of month
    end_of_day: "0 23 * * *"          # 11 PM daily
    pre_market: "0 6 * * 1-5"         # 6 AM weekdays
    after_hours: "0 20 * * 1-5"       # 8 PM weekdays
  
  # Schedule types explanation:
  # - scheduled: Download at specific times using cron expressions
  # - real_time: Download continuously with specified intervals
  # - on_demand: Download only when manually triggered
  
  # Timezone support:
  # Common timezones: UTC, America/New_York, America/Chicago, 
  # America/Denver, America/Los_Angeles, Europe/London, Asia/Tokyo

# Storage configurations (optional)
storage:
  # Local file storage
  local:
    enabled: true
    base_path: "./downloads"
    
  # Database storage (example)
  database:
    enabled: false
    type: "postgresql"
    host: "localhost"
    port: 5432
    database: "feed_data"
    username: "user"
    password: "password"
    
  # Cloud storage (example)
  cloud:
    enabled: false
    type: "s3"
    bucket: "feed-downloader-data"
    region: "us-east-1"
    access_key: "your_access_key"
    secret_key: "your_secret_key"